name: Native

# The native build in native/: C on gesso, with the engines loaded at run time.
on:
  push:
    branches: [main, feat/native-port]
    paths: ["native/**", ".github/workflows/native.yml"]
  pull_request:
    paths: ["native/**", ".github/workflows/native.yml"]

permissions:
  contents: read

# A newer push to a branch makes the run for an older one moot.
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, engines: linux-x64 }
          - { os: windows-2025, engines: windows-x64 }
          - { os: macos-15, engines: macos-arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
      - name: Fetch the engine libraries
        run: tools/fetch-engines.sh ${{ matrix.engines }}
      - name: Build
        run: zig build
      # Without models: WAV reading, worker messages and a worker that dies.
      - name: Test
        run: zig build test
      # Starts the tray app far enough to have everything running, and has each worker open its
      # engine library.
      - name: Check that the app starts and the engines load
        run: SDL_VIDEODRIVER=${{ runner.os == 'Linux' && 'dummy' || '' }} SDL_AUDIODRIVER=dummy zig-out/bin/earheart --smoke-test --engine-check
      # The remote engines against a stand-in for an OpenAI-compatible service.
      - name: Dictate through a remote service
        run: tests/remote.sh
      # One dictation as a user makes it: hotkey, a recording as the microphone, hotkey, and the
      # text in a focused window. Needs the small speech model.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: models-parakeet-tdt-0.6b-v3-int8
          enableCrossOsArchive: true
      - name: Fetch the small speech model
        run: zig-out/bin/earheart models --models ../models download stt/parakeet-tdt-0.6b-v3-int8
      - name: Install the X tools the end-to-end test drives
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xdotool openbox imagemagick
      - name: Dictate end to end
        env:
          EARHEART_MODELS: ${{ github.workspace }}/models
          EARHEART_E2E_SHOT: ${{ runner.temp }}/overlay-${{ matrix.os }}.png
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            # A crash of either program leaves a core to read the stack from.
            sudo sysctl -q kernel.core_pattern=/tmp/core.%e.%p
            ulimit -c unlimited
            xvfb-run -a sh -c 'openbox & sleep 1; tests/e2e.sh' || status=$?
            for core in /tmp/core.*; do
              [ -f "$core" ] || continue
              sudo apt-get install -y gdb >/dev/null 2>&1
              gdb -q -batch -ex bt "zig-out/bin/$(echo "$core" | cut -d. -f2)" "$core" 2>&1 | tail -30
            done
            exit ${status:-0}
          fi
          tests/e2e.sh
      - name: Keep the screen as it was mid-recording
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: overlay-${{ matrix.os }}
          path: ${{ runner.temp }}/overlay-${{ matrix.os }}.png
          if-no-files-found: ignore
